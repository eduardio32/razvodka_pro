<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Разводка Про — Профессиональный электромонтаж в Самаре и Самарской области</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg-body: #f5f7fb;
            --dark-blue: #0b1a2e;
            --blue-hover: #1e2a44;
            --accent: #f5a623;
            --accent-light: rgba(245, 166, 35, 0.12);
            --text-main: #0b1a2e;
            --text-muted: #4a5675;
            --card-border: #edf1f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ---------- ШАПКА ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 14px 0;
            width: 100%;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.4px;
            color: var(--dark-blue);
            text-decoration: none;
            z-index: 1001;
        }

        .logo i, .logo span {
            color: var(--accent);
        }

        .logo i {
            font-size: 28px;
        }

        .nav {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav a {
            text-decoration: none;
            color: #1e2a44;
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
            position: relative;
        }

        .nav a:not(.btn-ghost)::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 2px;
            background: var(--accent);
            transition: width 0.25s;
        }

        .nav a:not(.btn-ghost):hover::after {
            width: 100%;
        }

        .nav a:hover {
            color: var(--accent);
        }

        .nav .btn-ghost {
            background: var(--dark-blue);
            color: #fff !important;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s;
            border: none;
            cursor: pointer;
        }

        .nav .btn-ghost:hover {
            background: var(--blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(11, 26, 46, 0.2);
        }

        /* Кнопка мобильного меню (гамбургер) */
        .mobile-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .mobile-toggle span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: var(--dark-blue);
            border-radius: 3px;
            transition: all 0.3s ease-in-out;
        }

        .mobile-toggle.is-active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .mobile-toggle.is-active span:nth-child(2) {
            opacity: 0;
        }
        .mobile-toggle.is-active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* ---------- ГЕРОЙ ---------- */
        .hero {
            padding: 80px 0 70px;
            position: relative;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-content h1 .highlight {
            color: var(--accent);
            position: relative;
            display: inline-block;
        }

        .hero-content h1 .highlight::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 4px;
            width: 100%;
            height: 10px;
            background: rgba(245, 166, 35, 0.25);
            z-index: -1;
            border-radius: 4px;
        }

        .hero-content p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(11, 26, 46, 0.05);
            color: var(--dark-blue);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .location-badge i {
            color: var(--accent);
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--dark-blue);
            color: #fff;
            box-shadow: 0 12px 32px rgba(11, 26, 46, 0.20);
        }

        .btn-primary:hover {
            background: var(--blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(11, 26, 46, 0.28);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark-blue);
            border: 2px solid #d0d7e6;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(245, 166, 35, 0.04);
        }

        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image .illustration {
            width: 100%;
            max-width: 460px;
            height: 460px;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 30px 60px rgba(11, 26, 46, 0.15);
            border: 2px solid #fff;
            cursor: pointer;
        }

        .hero-image .illustration img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .hero-image .illustration:hover img {
            transform: scale(1.03);
        }

        .hero-image .badge {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: var(--dark-blue);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        .hero-image .badge i {
            font-size: 18px;
            color: var(--accent);
        }

        /* ---------- БРЕНДЫ ---------- */
        .brands-section {
            padding: 30px 0;
            background: #fff;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }

        .brands-title {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .brands-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-item {
            font-size: 20px;
            font-weight: 800;
            color: #8b9abf;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ---------- ПРЕИМУЩЕСТВА ---------- */
        .features {
            padding: 80px 0;
        }

        .features-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 56px;
        }

        .tag {
            display: inline-block;
            background: var(--accent-light);
            color: #b87c1a;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 6px 20px;
            border-radius: 40px;
            margin-bottom: 14px;
        }

        .features-header h2 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 14px;
        }

        .features-header p {
            font-size: 17px;
            color: var(--text-muted);
        }

        .grid-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
        }

        .feature-card {
            background: #fff;
            padding: 36px 32px;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feature-card:hover {
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            transform: translateY(-4px);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-card .icon {
            width: 56px;
            height: 56px;
            background: var(--bg-body);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
            margin-bottom: 18px;
            transition: 0.3s;
        }

        .feature-card:hover .icon {
            background: var(--accent);
            color: #fff;
        }

        .feature-card h3 {
            font-size: 22px;
            font-weight: 700;
